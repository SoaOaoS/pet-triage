<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetTriage — Urgences vétérinaires</title>
  <meta name="description" content="Évaluez rapidement l'urgence d'un problème de santé chez votre chien ou chat.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="header-icon">🐾</div>
      <h1>PetTriage</h1>
      <p class="subtitle">Évaluation rapide de l'urgence vétérinaire</p>
    </header>

    <main class="main" id="main" role="main">
      <div class="card" id="card">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="content" class="content">
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>PetTriage ne remplace pas un avis vétérinaire professionnel. En cas de doute, consultez un vétérinaire.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
